name: Сборка и пуш в Docker Hub

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Загрузить код из репозитория
        uses: actions/checkout@v4

      - name: 2. Показать файлы
        run: find . -maxdepth 5 -type f

      - name: 3. Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_Name }}
          password: ${{ secrets.DOCKER_Password }}

      - name: 4. Собрать и отправить образ в Docker Hub
        uses: docker/build-push-action@v2
        with:
          context: .
          # Шлях залишаємо як у вашій останній спробі, оскільки Docker його бачить
          file: Docker_Kubernetes/Lesson_6/Lesson_6(GameTracker)/Lesson_6(GameTracker)/Dockerfile
          push: true
          tags: hulumulushnik/gametracker:v${{ github.run_number }}

      - name: 5. Отправка отчета в Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 **Нова версія GameTracker успішно зібрана та готова до релізу!**
            
            📦 **Репозиторій:** ${{ github.repository }}
            🔢 **Номер збірки:** ${{ github.run_number }}
            👤 **Автор коміту:** ${{ github.actor }}
            
            🔗 [Переглянути коміт](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
