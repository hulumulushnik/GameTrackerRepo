name: Сборка и пуш в Docker Hub
 
on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: 1. Загрузить код из репозитория
        uses: actions/checkout@v4
 
      - name: 2. Показать файлы
        run: find . -maxdepth 5 -type f
 
      - name: 3. Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_Name }}
          password: ${{ secrets.DOCKER_Password }}
 
      - name: 4. Собрать и отправить образ в Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          # Шлях залишаємо як у вашій останній спробі, оскільки Docker його бачить
          file: ./Lesson_6/Lesson_6(GameTracker)/Lesson_6(GameTracker)/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_Name }}/gametracker:v${{ github.run_number }}
